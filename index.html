<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>WordSv</title>
  <meta name="description" content="Learn Swedish B2/C1 vocabulary with spaced repetition">
  <meta name="theme-color" content="#006AA7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E3350" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WordSv">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" class="logo"> WordSv</div>
    <div class="stats" id="stats"></div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <span class="tab-glow" aria-hidden="true"></span>
    <button data-tab="learn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Learn</span>
    </button>
    <button data-tab="review">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>
      <span>Review</span><b class="badge" id="dueBadge" hidden></b>
    </button>
    <button data-tab="moments">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke-dasharray="4 2.2"/><path d="M12 8.5v7M8.5 12h7"/></svg>
      <span>Moments</span><b class="badge" id="momentsBadge" hidden></b>
    </button>
    <button data-tab="words">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      <span>My words</span>
    </button>
    <button data-tab="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>
      <span>Me</span>
    </button>
  </nav>

  <script type="module" src="src/app.js"></script>
</body>
</html>
